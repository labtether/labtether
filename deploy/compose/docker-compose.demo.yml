## Demo deployment for App Store review.
## Extends docker-compose.deploy.yml with demo mode, seed job, and relaxed bind addresses.
##
## Usage:
##   LABTETHER_IMAGE='ghcr.io/labtether/labtether:vX.Y.Z@sha256:<64 hex>' ./scripts/demo-up.sh
##   or: LABTETHER_IMAGE='ghcr.io/labtether/labtether:vX.Y.Z@sha256:<64 hex>' docker compose --env-file .env.demo -f deploy/compose/docker-compose.deploy.yml -f deploy/compose/docker-compose.demo.yml up -d
##
## The demo-seed service runs once after the hub is healthy and loads the
## sample home lab: groups, links, alerts, incidents, logs and metric history.
## The hub creates one read-only viewer and signs every visitor in as it.

services:
  labtether:
    environment:
      LABTETHER_DEMO_MODE: "true"
      LABTETHER_DEMO_CONFIRM: "yes-this-is-a-demo-instance"
      LABTETHER_TLS_MODE: "disabled"
      # Unset admin credentials so only the demo viewer user is created.
      LABTETHER_ADMIN_USERNAME: ""
      LABTETHER_ADMIN_PASSWORD: ""
    # Replace the loopback binding instead of adding a second one on 8080.
    ports: !override
      - "0.0.0.0:8080:8080"

  web-console:
    environment:
      NEXT_PUBLIC_DEMO_MODE: "true"
      LABTETHER_DEMO_MODE: "true"

  # web-console sits only on the internal console network. The no-secret
  # ingress publishes the console instead.
  console-ingress:
    ports: !override
      - "0.0.0.0:3000:3000"

  demo-seed:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE in .env.deploy}
    restart: "no"
    depends_on:
      labtether:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$(cat /bootstrap/postgres/password)"
        # The hub is healthy, so its migrations have run. Stop on the first
        # error: the seed is one transaction, so a failed load changes nothing.
        psql -v ON_ERROR_STOP=1 -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -f /seed/demo-seed.sql
        echo "Demo seed loaded."
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labtether}
      POSTGRES_USER: ${POSTGRES_USER:-labtether}
    # PostgreSQL is reachable only on the internal data network.
    networks:
      - data-plane
    volumes:
      - labtether-bootstrap:/bootstrap:ro
      # Paths resolve from the first Compose file's folder, deploy/compose.
      - ../../scripts/demo-seed.sql:/seed/demo-seed.sql:ro
