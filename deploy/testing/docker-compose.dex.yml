# Lightweight Dex OIDC provider for testing.
# Usage: docker compose -f deploy/testing/docker-compose.dex.yml up -d
# Teardown: docker compose -f deploy/testing/docker-compose.dex.yml down
#
# OIDC Issuer: http://localhost:5556/dex
# Test user: testuser@localhost / password
# The Hub must explicitly set LABTETHER_ALLOW_INSECURE_TRANSPORT=true,
# LABTETHER_OUTBOUND_ALLOW_LOOPBACK=true, and
# LABTETHER_OIDC_ALLOW_LOOPBACK=true while using this development stack.

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
