<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="lt-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFCF8"/>
      <stop offset="1" stop-color="#DCD5C7"/>
    </linearGradient>
    <linearGradient id="lt-glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity=".2"/>
      <stop offset=".35" stop-color="#FFF" stop-opacity=".05"/>
      <stop offset=".35" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lt-led">
      <stop offset="0" stop-color="#00FFCC" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#00FFCC" stop-opacity=".2"/>
      <stop offset="1" stop-color="#00FFCC" stop-opacity="0"/>
    </radialGradient>
    <filter id="lt-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="near"/>
      <feGaussianBlur in="near" stdDeviation="6" result="far"/>
      <feMerge>
        <feMergeNode in="far"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="lt-screen">
      <rect x="33" y="38" width="134" height="94" rx="6"/>
    </clipPath>
  </defs>

  <!-- Body -->
  <rect x="10" y="15" width="180" height="170" rx="24" fill="url(#lt-body)"/>
  <rect x="12" y="17" width="176" height="166" rx="22" fill="none" stroke="#FFF" stroke-opacity=".9" stroke-width="2"/>
  <rect x="10.5" y="15.5" width="179" height="169" rx="23.5" fill="none" stroke="#8C8577" stroke-opacity=".5"/>

  <!-- Bezel -->
  <rect x="25" y="30" width="150" height="110" rx="12" fill="#8C8577"/>
  <rect x="26" y="31" width="148" height="108" rx="11" fill="#0A0A0A"/>

  <!-- Screen: prompt, face, glare -->
  <g clip-path="url(#lt-screen)">
    <rect x="33" y="38" width="134" height="94" fill="#1A0012"/>
    <g fill="none" stroke="#FF79C6" stroke-linecap="round" stroke-linejoin="round" filter="url(#lt-glow)">
      <path d="M42 55l5 4-5 4m8 1h6" stroke-width="2"/>
      <path d="M70 78q10-10 20 0m20 0q10-10 20 0M90 95q10 10 20 0" stroke-width="3.5"/>
    </g>
    <rect x="33" y="38" width="134" height="94" fill="url(#lt-glare)"/>
  </g>
  <rect x="33.5" y="38.5" width="133" height="93" rx="5.5" fill="none" stroke="#FFF" stroke-opacity=".1"/>

  <!-- Drive slot -->
  <rect x="33" y="158" width="55" height="4" rx="2" fill="#8C8577"/>
  <path d="M33 160a2 2 0 0 1 2-2h51a2 2 0 0 1 2 2z" fill="#4A443A" fill-opacity=".5"/>

  <!-- LED -->
  <circle cx="100" cy="160" r="9" fill="url(#lt-led)"/>
  <circle cx="100" cy="160" r="2.5" fill="#00FFCC"/>

  <!-- Power button -->
  <circle cx="158" cy="160" r="9" fill="#8C8577"/>
  <circle cx="158" cy="160" r="8" fill="#4A1515"/>
  <circle cx="158" cy="160" r="7" fill="#A82B2B"/>
  <circle cx="158" cy="158" r="3.5" fill="#FF6B6B" fill-opacity=".8"/>
</svg>
