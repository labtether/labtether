name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main", "master", "codex/**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py

  qa-select:
    name: Select risk-based QA contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      connector_system: ${{ steps.select.outputs.connector_system }}
      hub_behavior: ${{ steps.select.outputs.hub_behavior }}
      hub_installed_system: ${{ steps.select.outputs.hub_installed_system }}
      hub_transport: ${{ steps.select.outputs.hub_transport }}
      restore_roundtrip: ${{ steps.select.outputs.restore_roundtrip }}
      schedule_platform: ${{ steps.select.outputs.schedule_platform }}
      selected_json: ${{ steps.select.outputs.selected_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test QA contract selector
        run: python3 -m unittest scripts/ci/test_select_qa_contracts.py

      - name: Select contracts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL_MODE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          selector=(python3 scripts/ci/select-qa-contracts.py)
          if [[ "${FULL_MODE}" == "true" || -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            selector+=(--full)
          else
            selector+=(--base "${BASE_SHA}" --head "${GITHUB_SHA}")
          fi
          "${selector[@]}"

  go-checks:
    needs: [line-limit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require source-size gate
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Check formatting
        run: bash scripts/ci/check-go-format.sh

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Install pinned source-quality tools
        env:
          GOBIN: ${{ runner.temp }}/quality-bin
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.25.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Scan Go dependencies for reachable vulnerabilities
        run: govulncheck ./...

      - name: Strict gosec gate
        run: make security-gosec

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Scan current source for secrets
        run: gitleaks dir . --no-banner --redact --timeout 300

  hub-behavior-contract:
    name: Contract / Hub high-risk behavior
    needs: qa-select
    if: needs.qa-select.outputs.hub_behavior == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Run authorization, restore, schedule, and runtime contracts
        run: |
          go test \
            ./cmd/labtether \
            ./internal/apikeys \
            ./internal/auth \
            ./internal/connectors/pbs \
            ./internal/hubapi/pbs \
            ./internal/hubapi/schedulespkg \
            ./internal/schedules \
            ./internal/securityruntime

  connector-system-contract:
    name: Contract / PBS and Proxmox connectors
    needs: qa-select
    if: needs.qa-select.outputs.connector_system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Run PBS and Proxmox handler and authorization contracts
        run: |
          go test \
            ./internal/connectors/pbs \
            ./internal/connectors/proxmox \
            ./internal/hubapi/pbs \
            ./internal/hubapi/proxmox
          go test ./cmd/labtether -run 'PBS|Proxmox'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/console/package-lock.json

      - name: Install console dependencies
        working-directory: web/console
        run: npm ci

      - name: Run PBS and Proxmox console contracts
        working-directory: web/console
        run: |
          npx vitest run \
            'app/[locale]/(console)/nodes/[id]/pbs/__tests__/pbsUserQA.test.tsx' \
            'app/api/pbs/assets/[assetId]/__tests__/mutationRoutes.test.ts' \
            'app/api/settings/proxmox/__tests__/route.test.ts' \
            'app/api/settings/proxmox/[collectorId]/__tests__/route.test.ts'

  restore-roundtrip-contract:
    name: Contract / Restore and backup paths
    needs: qa-select
    if: needs.qa-select.outputs.restore_roundtrip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Run PBS snapshot, backup, and restore-path contracts
        run: |
          go test ./internal/connectors/pbs ./internal/hubapi/pbs
          go test ./cmd/labtether -run 'PBS|Backup|Restore|Snapshot'
          bash -n scripts/db-backup.sh scripts/db-restore.sh

  schedule-platform-contract:
    name: Contract / Schedule platform behavior
    needs: qa-select
    if: needs.qa-select.outputs.schedule_platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Run schedule API, persistence, and worker contracts
        run: |
          go test \
            ./internal/hubapi/schedulespkg \
            ./internal/hubapi/worker \
            ./internal/persistence \
            ./internal/schedules
          go test ./cmd/labtether -run 'Schedule'

  hub-transport-contract:
    name: Contract / Hub transport and enrollment
    needs: qa-select
    if: needs.qa-select.outputs.hub_transport == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Run Hub agent, enrollment, TLS/WSS, and MCP contracts
        run: |
          go test \
            ./cmd/labtether \
            ./internal/agentidentity \
            ./internal/agentmgr \
            ./internal/certmgr \
            ./internal/enrollment \
            ./internal/mcpserver \
            ./internal/servicehttp

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/console/package-lock.json

      - name: Install console dependencies
        working-directory: web/console
        run: npm ci

      - name: Run console transport proxy contracts
        working-directory: web/console
        run: |
          npx vitest run \
            lib/__tests__/proxyMatcher.test.ts \
            scripts/__tests__/runtime-proxy.test.mjs
          npm run build
          npm run test:runtime-proxy:standalone

  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Go race test
        run: go test -race ./...

  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://labtether:labtether@localhost:5432/labtether?sslmode=disable
      LABTETHER_OWNER_TOKEN: dev-owner-token-change-me
      LABTETHER_API_TOKEN: dev-owner-token-change-me
      LABTETHER_ADMIN_USERNAME: admin
      LABTETHER_ADMIN_PASSWORD: password
      LABTETHER_TLS_MODE: disabled
      DEV_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate ephemeral CI encryption key
        shell: bash
        run: printf 'LABTETHER_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Backend hotspot perf gate
        run: make perf-gate

      - name: Run reduced apples harness + thresholds
        run: bash scripts/perf/ci-hotspot.sh

      - name: Upload backend perf artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-hotspot-perf-artifacts
          path: /tmp/labtether-perf-artifacts
          if-no-files-found: warn
          retention-days: 1

  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/console
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Standalone runtime WebSocket proxy regression
        run: npm run test:runtime-proxy:standalone

  docs-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Script unit tests
        run: node --test scripts/lib/http-redirect.test.js

      - name: Deploy hardening contract
        run: ./scripts/ci/test-deploy-hardening.sh

      - name: Docs quality checks
        run: make check-docs

  # web-e2e (plain HTTP) was removed in favor of web-e2e-https. Production
  # serves the console over HTTPS, and the HTTPS variant exercises the same
  # 122 Playwright specs under the production server path. The plain-HTTP
  # variant had been timing out (20m cap vs ~21m needed) and producing many
  # transient failures that didn't reproduce under HTTPS, likely due to
  # secure-context gating in browser APIs the console uses. If HTTP-mode
  # coverage is wanted again, bring it back with a 30m timeout and triage
  # the HTTP-only failures first.

  web-e2e-https:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web/console
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E over self-signed HTTPS
        run: npm run test:e2e:https -- --ignore-snapshots

      - name: Upload HTTPS E2E Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-e2e-https-playwright
          path: |
            web/console/playwright-report
            web/console/test-results
          if-no-files-found: warn
          retention-days: 1

  web-visual-https:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/console
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run visual regression over self-signed HTTPS
        run: npm run test:visual:https

      - name: Upload HTTPS visual Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-visual-https-playwright
          path: |
            web/console/playwright-report
            web/console/test-results
          if-no-files-found: warn
          retention-days: 1

  stack-checks:
    needs: qa-select
    if: needs.qa-select.outputs.hub_installed_system == 'true' || needs.qa-select.outputs.connector_system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout labtether-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: labtether/labtether-agent
          # The root-cause release gate verifies that this exact installed
          # stack child matches the coordinated Go agent release source.
          ref: 8805c74b2425b038768b626bf6c8fcd2b196e74b
          persist-credentials: false
          path: labtether-agent

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Build agent image locally
        run: |
          docker build \
            --tag labtether-agent:ci-base \
            --build-arg VERSION=ci \
            labtether-agent
          docker build --tag labtether-agent:ci - <<'DOCKERFILE'
          FROM labtether-agent:ci-base
          USER root
          RUN apk update
          USER agent
          DOCKERFILE

      - name: Verify Alpine package-index fixture
        run: |
          docker run --rm --entrypoint /bin/sh labtether-agent:ci -eu -c '
            output="$(apk version -l "<" 2>&1)"
            case "${output}" in
              *WARNING:*)
                echo "apk package-index fixture emitted a warning" >&2
                exit 1
                ;;
            esac
            printf "%s\n" "${output}" | grep -Eq "^Installed:[[:space:]]+Available:$"
          '

      - name: Verify fail-closed agent release manifest generation
        run: go test ./scripts/release/verify-agent-release -count=1

      - name: Prepare agent distribution build context
        run: mkdir -p ./agent-dist && touch ./agent-dist/.keep

      - name: Prepare environment
        run: bash scripts/ci/prepare-smoke-environment.sh

      - name: Validate opt-in QA agent profile rendering
        run: bash scripts/ci/check-smoke-compose-profile.sh

      - name: Smoke test
        # Downstream steps intentionally reuse this isolated runner's stack.
        run: ./scripts/smoke-test.sh --reuse-compose-stack --keep

      - name: Stage one-use agent enrollment
        run: bash scripts/ci/stage-smoke-agent-enrollment.sh

      - name: Verify real agent is connected over authenticated WSS
        run: |
          set -Eeuo pipefail
          trap 'COMPOSE_PROFILES=ci-agent docker compose ps -a qa-agent || true; COMPOSE_PROFILES=ci-agent docker compose logs --no-color qa-agent || true' ERR
          COMPOSE_PROFILES=ci-agent docker compose up -d --no-deps qa-agent
          go run ./scripts/ci/assert-connected-agent \
            --base-url https://localhost:8443 \
            --ca-file "${RUNNER_TEMP}/labtether-ca/ca.crt" \
            --asset-id labtether-ci-agent \
            --timeout 60s
          COMPOSE_PROFILES=ci-agent docker compose exec -T qa-agent /bin/sh -eu -c '
            test -z "${LABTETHER_API_TOKEN:-}"
            test -s /tmp/labtether/agent-token
            test ! -e /run/labtether-enrollment/enrollment-token
          '

      - name: Integration test
        run: |
          INTEGRATION_MANAGE_STACK=false \
            ./scripts/integration-queue-flow.sh \
              --allow-remote-exec \
              --target labtether-ci-agent \
              --ca-file "${RUNNER_TEMP}/labtether-ca/ca.crt"

      - name: Dump container logs on failure
        if: failure()
        run: COMPOSE_PROFILES=ci-agent docker compose logs --no-color 2>&1 | tail -100 || true

      - name: Tear down
        if: always()
        run: COMPOSE_PROFILES=ci-agent docker compose down -v || true
