name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

# Run one release at a time so image tags and the latest release move in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate agent manifest and download binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/release/generate-agent-manifest.sh "${RELEASE_VERSION}" ./agent-dist

      # Push by digest only. No version or latest tag exists until the image
      # has passed the runtime check below.
      - name: Build and push all-in-one image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          outputs: type=image,name=ghcr.io/labtether/labtether,push-by-digest=true,name-canonical=true,push=true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Start the deploy stack from the pushed image
        timeout-minutes: 15
        env:
          LABTETHER_IMAGE: ghcr.io/labtether/labtether@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${LABTETHER_IMAGE}"
          ./scripts/ci/test-deploy-image-runtime.sh "${LABTETHER_IMAGE}"

      - name: Attest pushed image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/labtether/labtether
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Render deploy release artifacts
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ./scripts/release/render-deploy-artifacts.sh \
            --version "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --image-digest "${IMAGE_DIGEST}" \
            --output-dir "${RUNNER_TEMP}/release-artifacts"

      - name: Validate deploy release artifacts
        run: |
          cd "${RUNNER_TEMP}/release-artifacts"
          docker compose -f docker-compose.deploy.yml config --quiet
          sha256sum --check SHA256SUMS
          ! grep -R --fixed-strings 'exec /service' docker-compose.deploy.yml

      - name: Attest deploy release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-artifacts/docker-compose.deploy.yml
            ${{ runner.temp }}/release-artifacts/deploy.env.example
            ${{ runner.temp }}/release-artifacts/deploy-manifest.json
            ${{ runner.temp }}/release-artifacts/SHA256SUMS

      # Only the highest vX.Y.Z tag moves latest, so a patch for an older line
      # or a pre-release never takes it from a newer release.
      - name: Decide whether this release becomes latest
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          move_latest=false
          if [[ "${RELEASE_VERSION}" =~ ${semver} ]]; then
            highest="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's|^refs/tags/||' | { grep -E "${semver}" || true; } | sort -V | tail -n 1)"
            if [[ "${highest}" == "${RELEASE_VERSION}" ]]; then
              move_latest=true
            fi
          fi
          echo "move_latest=${move_latest}" >> "${GITHUB_OUTPUT}"

      - name: Tag the tested image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ github.ref_name }}
          MOVE_LATEST: ${{ steps.latest.outputs.move_latest }}
        run: |
          set -Eeuo pipefail
          image=ghcr.io/labtether/labtether
          tags=("${RELEASE_VERSION}")
          if [[ "${MOVE_LATEST}" == true ]]; then
            tags+=(latest)
          fi
          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "${image}:${tag}" "${image}@${IMAGE_DIGEST}"
            actual="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${image}:${tag}" | jq -r .digest)"
            if [[ "${actual}" != "${IMAGE_DIGEST}" ]]; then
              echo "::error::${image}:${tag} points at ${actual}, not the tested ${IMAGE_DIGEST}"
              exit 1
            fi
          done

      - name: Upload release artifacts to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          make_latest: ${{ steps.latest.outputs.move_latest }}
          files: |
            ${{ runner.temp }}/release-artifacts/docker-compose.deploy.yml
            ${{ runner.temp }}/release-artifacts/deploy.env.example
            ${{ runner.temp }}/release-artifacts/deploy-manifest.json
            ${{ runner.temp }}/release-artifacts/SHA256SUMS
