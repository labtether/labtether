name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate agent manifest and download binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/release/generate-agent-manifest.sh "${RELEASE_VERSION}" ./agent-dist

      - name: Build and push all-in-one image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          push: true
          tags: |
            ghcr.io/labtether/labtether:${{ github.ref_name }}
            ghcr.io/labtether/labtether:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Verify pushed deploy image runtime mounts
        env:
          LABTETHER_IMAGE: ghcr.io/labtether/labtether@${{ steps.build.outputs.digest }}
        run: |
          docker pull "${LABTETHER_IMAGE}"
          ./scripts/ci/test-deploy-image-runtime.sh "${LABTETHER_IMAGE}"

      - name: Attest pushed image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/labtether/labtether
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Render deploy release artifacts
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ./scripts/release/render-deploy-artifacts.sh \
            --version "${GITHUB_REF_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --image-digest "${IMAGE_DIGEST}" \
            --output-dir "${RUNNER_TEMP}/release-artifacts"

      - name: Validate deploy release artifacts
        run: |
          cd "${RUNNER_TEMP}/release-artifacts"
          docker compose -f docker-compose.deploy.yml config --quiet
          sha256sum --check SHA256SUMS
          ! grep -R --fixed-strings 'exec /service' docker-compose.deploy.yml

      - name: Attest deploy release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-artifacts/docker-compose.deploy.yml
            ${{ runner.temp }}/release-artifacts/.env.deploy.example
            ${{ runner.temp }}/release-artifacts/deploy-manifest.json
            ${{ runner.temp }}/release-artifacts/SHA256SUMS

      - name: Upload release artifacts to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ runner.temp }}/release-artifacts/docker-compose.deploy.yml
            ${{ runner.temp }}/release-artifacts/.env.deploy.example
            ${{ runner.temp }}/release-artifacts/deploy-manifest.json
            ${{ runner.temp }}/release-artifacts/SHA256SUMS
